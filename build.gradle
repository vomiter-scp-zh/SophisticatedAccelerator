plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "curse.maven:sophisticated-core-618298:${core_file_id}"
    implementation "curse.maven:sophisticated-backpacks-422301:${backpacks_file_id}"
    implementation "curse.maven:sophisticated-storage-619320:${storage_file_id}"
    implementation "curse.maven:farmers-sophisticated-backpacks-1712728:9170082"
    implementation "curse.maven:farmers-delight-398521:8765184"
}

var resourceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range
]
tasks.named('processResources', ProcessResources).configure {
    inputs.properties resourceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand resourceProperties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { standardInput = System.in }
java.withSourcesJar()

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}
